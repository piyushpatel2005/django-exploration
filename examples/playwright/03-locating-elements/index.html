<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locating Elements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
        }
        .container {
            background-color: #f0f0f0;
            padding: 20px;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
        a {
            color: #3498db;
            text-decoration: none;
            margin-right: 20px;
        }
        input {
            padding: 8px;
            margin: 10px 0;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Locating Elements Test Page</h1>
    <p>This page contains various elements for testing locators.</p>
    
    <div class="container">
        <h2>Heading Level 2</h2>
        <p>This is a paragraph inside a container.</p>
        <p>Another paragraph for testing multiple elements.</p>
    </div>
    
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
    </div>
    
    <div>
        <button id="submit-btn" class="primary">Submit</button>
        <button class="secondary">Cancel</button>
    </div>
    
    <div>
        <a href="#section1">More information</a>
        <a href="#section2">Learn more</a>
        <a href="#section3">Contact us</a>
    </div>
    
    <div id="section1">
        <h2>Section 1</h2>
        <p>Content for section 1.</p>
    </div>
</body>
</html>
